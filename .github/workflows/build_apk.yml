name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip python3-dev \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev openjdk-17-jdk

      - name: Install buildozer and patch hostpython version
        run: |
          pip3 install buildozer cython python-for-android
          P4A_PATH=$(python3 -c "import pythonforandroid; import os; print(os.path.dirname(pythonforandroid.__file__))")
          echo "p4a path: $P4A_PATH"
          RECIPE="$P4A_PATH/recipes/hostpython3/__init__.py"
          echo "Before patch:"
          grep version $RECIPE
          sed -i "s/version = .*/version = '3.11.9'/" $RECIPE
          echo "After patch:"
          grep version $RECIPE

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-apk
          path: bin/*.apk
          if-no-files-found: error
