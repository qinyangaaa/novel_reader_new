name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip python3-dev \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev openjdk-17-jdk

      - name: Install buildozer
        run: pip3 install buildozer cython

      - name: Download p4a and patch hostpython version
        run: |
          buildozer android debug 2>&1 | head -5 || true
          P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"
          if [ -d "$P4A_DIR" ]; then
            RECIPE="$P4A_DIR/pythonforandroid/recipes/hostpython3/__init__.py"
            echo "Patching: $RECIPE"
            sed -i "s/version = '[0-9.]*'/version = '3.11.9'/" $RECIPE
            echo "After patch:"
            grep version $RECIPE
          else
            echo "p4a not found at $P4A_DIR, trying workspace"
            find $HOME -name "hostpython3" -type d 2>/dev/null
          fi

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-apk
          path: bin/*.apk
          if-no-files-found: error
