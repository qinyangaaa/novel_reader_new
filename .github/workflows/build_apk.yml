name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip python3-dev \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            openjdk-17-jdk python3-is-python

      - name: Check Python version
        run: python3 --version

      - name: Install buildozer
        run: |
          pip3 install buildozer cython --break-system-packages

      - name: Build APK
        run: |
          export PYTHON=python3
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-apk
          path: bin/*.apk
          if-no-files-found: error
